name: Automated tests

on:
  push

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check --output-format=github .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: Run Docker Compose
        run:
          cd docker;
          echo POSTGRES_USER=${{ secrets.POSTGRES_USER }} > .env;
          echo POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} >> .env;
          echo POSTGRES_DB_AUTH=${{ secrets.POSTGRES_DB_AUTH }} >> .env;
          echo POSTGRES_DB_UNIVERSITY=${{ secrets.POSTGRES_DB_UNIVERSITY }} >> .env;
          echo AUTH_SERVICE_INTERNAL_URL=${{ secrets.AUTH_SERVICE_INTERNAL_URL }} >> .env;
          echo AUTH_SERVICE_API_URL=${{ secrets.AUTH_SERVICE_API_URL }} >> .env;
          echo UNIVERSITY_SERVICE_INTERNAL_URL=${{ secrets.UNIVERSITY_SERVICE_INTERNAL_URL }} >> .env;
          echo UNIVERSITY_SERVICE_API_URL=${{ secrets.UNIVERSITY_SERVICE_API_URL }} >> .env;
          docker compose up -d
      - name: Run tests
        run: pytest --alluredir=allure-results
        continue-on-error: true
      - name: Store allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  generate-report:
    name: Generate report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Install java
        uses: actions/setup-java@v3
        with:
          distribution: "microsoft"
          java-version: "21"
      - name: Install allure
        run:
          sudo wget https://github.com/allure-framework/allure2/releases/download/2.23.1/allure-2.23.1.tgz
          && sudo tar -zxvf allure-2.23.1.tgz -C /opt/
          && sudo ln -s /opt/allure-2.23.1/bin/allure /usr/bin/allure
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
      - name: Allure generate
        run: allure generate -c  allure-results -o _site
      - name: Store generated report
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: path/to/artifact
          retention-days: 1

  publish-report:
    name: Publish report
    runs-on: ubuntu-latest
    needs: generate-report
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

